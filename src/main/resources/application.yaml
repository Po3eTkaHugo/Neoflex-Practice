server:
  port: 8457
  servlet:
    context-path: /api

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  liquibase:
    enabled: true
    change-log: db/changelog/changelog-master.yaml

  datasource:
    url: jdbc:postgresql://localhost:4321/todolist_db
    driver-class-name: org.postgresql.Driver
    username: admin
    password: 1234