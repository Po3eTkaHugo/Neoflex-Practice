services:
  postgres:
    image: postgres:15-alpine
    container_name: todolist_postgres
    environment:
      POSTGRES_DB: todolist_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
    ports:
      - "4321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: